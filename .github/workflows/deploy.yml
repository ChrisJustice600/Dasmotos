name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          AB8BA9: ${{ secrets.AB8BA9 }}
          BF5A09: ${{ secrets.BF5A09 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AB8BA9', ''), os.environ.get('BF5A09', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 45c152390f1e7748ffa441ebdbf554 -->', a)
          if b:
              patched = patched.replace('<!-- 1871ad46bcdffcccfa48 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
